# If a config.py file exists, this file is ignored unless it's explicitly loaded
# via config.load_autoconfig(). For more information, see:
# https://github.com/qutebrowser/qutebrowser/blob/main/doc/help/configuring.asciidoc#loading-autoconfigyml
# DO NOT edit this file by hand, qutebrowser will overwrite it.
# Instead, create a config.py - see :help for details.

config_version: 2
settings:
  auto_save.session:
    global: true
  bindings.commands:
    global:
      normal:
        <Ctrl+l>: spawn --userscript qute-pass
        O: cmd-set-text -s :open -t -s
        o: cmd-set-text -s :open -s
  bindings.key_mappings:
    global:
      <Ctrl-6>: <Ctrl-^>
      <Ctrl-Enter>: <Ctrl-Return>
      <Ctrl-I>: <Tab>
      <Ctrl-J>: <Return>
      <Ctrl-M>: <Return>
      <Ctrl-[>: <Escape>
      <Enter>: <Return>
      <Shift-Enter>: <Return>
      <Shift-Return>: <Return>
  content.blocking.method:
    global: both
  content.cookies.accept:
    global: no-3rdparty
  content.javascript.clipboard:
    global: access-paste
  content.notifications.enabled:
    https://web.whatsapp.com: true
    https://www.messenger.com: true
  content.pdfjs:
    global: true
  content.register_protocol_handler:
    https://mail.google.com?extsrc=mailto&url=%25s: true
  qt.chromium.process_model:
    global: process-per-site-instance
  qt.highdpi:
    global: true
  scrolling.smooth:
    global: true
  session.lazy_restore:
    global: true
  url.default_page:
    global: https://search.brave.com/
  url.searchengines:
    global:
      DEFAULT: https://search.brave.com/search?q={}
  zoom.default:
    global: 110%
